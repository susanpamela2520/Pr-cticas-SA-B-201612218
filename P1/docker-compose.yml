version: '3.8'
services:
  db:
    image: postgres:16
    container_name: academia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academia_db
    ports:
      - "5432:5432"
    volumes:
      - academia_data:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations:/docker-entrypoint-initdb.d

volumes:
  academia_data:
