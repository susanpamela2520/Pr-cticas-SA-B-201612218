apiVersion: v2
name: sa-platform
description: Plataforma de tickets de soporte - Practica 5 Software Avanzado (orquestacion con Helm)
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "15.5.20"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: rabbitmq
    version: "14.6.6"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: rabbitmq.enabled
