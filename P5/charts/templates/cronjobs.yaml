apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-scripts") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjobs") | nindent 4 }}
data:
  registro.sh: |-
{{ .Files.Get "files/cronjob-scripts/registro.sh" | indent 4 }}
  resumen.sh: |-
{{ .Files.Get "files/cronjob-scripts/resumen.sh" | indent 4 }}
---
# ---------- RBAC dedicado por cronjob (mínimo privilegio, sin default) ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-registro") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjob-registro") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-registro") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjob-registro") | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-registro") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjob-registro") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-registro") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-registro") }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-resumen") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjob-resumen") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-resumen") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjob-resumen") | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-resumen") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjob-resumen") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-resumen") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-resumen") }}
  apiGroup: rbac.authorization.k8s.io
---
# ---------- Cronjob 1: inserta un registro cada 2 minutos ----------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-registro") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjob-registro") | nindent 4 }}
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cronjob-registro
        spec:
          serviceAccountName: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-registro") }}
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
          containers:
            - name: cronjob-registro
              image: "{{ .Values.cronjobs.image.repository }}:{{ .Values.cronjobs.image.tag }}"
              command: ["/bin/bash", "/scripts/registro.sh"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              env:
                - name: DB_HOST
                  value: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") | quote }}
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: {{ .Values.global.dbName | quote }}
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db-credenciales") }}
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db-credenciales") }}
                      key: POSTGRES_PASSWORD
                - name: CARNE
                  value: {{ .Values.cronjobs.carne | required "Debes definir cronjobs.carne con tu numero de carne" | quote }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests: { cpu: 50m, memory: 32Mi }
                limits: { cpu: 200m, memory: 64Mi }
          volumes:
            - name: scripts
              configMap:
                name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-scripts") }}
                defaultMode: 0555
---
# ---------- Cronjob 2: cada 10 minutos, resume y publica al broker ----------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-resumen") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "cronjob-resumen") | nindent 4 }}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cronjob-resumen
        spec:
          serviceAccountName: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-resumen") }}
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
          containers:
            - name: cronjob-resumen
              image: "{{ .Values.cronjobs.image.repository }}:{{ .Values.cronjobs.image.tag }}"
              command: ["/bin/bash", "/scripts/resumen.sh"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              env:
                - name: DB_HOST
                  value: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") | quote }}
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: {{ .Values.global.dbName | quote }}
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db-credenciales") }}
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db-credenciales") }}
                      key: POSTGRES_PASSWORD
                - name: RABBITMQ_HOST
                  value: {{ include "sa-platform.fullname" (dict "root" $ "name" "broker") | quote }}
                - name: RABBITMQ_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.fullname" (dict "root" $ "name" "broker-credenciales") }}
                      key: RABBITMQ_DEFAULT_USER
                - name: RABBITMQ_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.fullname" (dict "root" $ "name" "broker-credenciales") }}
                      key: RABBITMQ_DEFAULT_PASS
                - name: COLA_RESUMENES
                  value: {{ .Values.global.rabbitmqQueueResumenesCron | default "cron.resumenes" | quote }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests: { cpu: 50m, memory: 32Mi }
                limits: { cpu: 200m, memory: 64Mi }
          volumes:
            - name: scripts
              configMap:
                name: {{ include "sa-platform.fullname" (dict "root" $ "name" "cronjob-scripts") }}
                defaultMode: 0555
