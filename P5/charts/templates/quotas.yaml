apiVersion: v1
kind: ResourceQuota
metadata:
  name: sa-p5-quota
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "quota") | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.resourceQuota.requestsCpu | default "2" | quote }}
    requests.memory: {{ .Values.resourceQuota.requestsMemory | default "2Gi" | quote }}
    limits.cpu: {{ .Values.resourceQuota.limitsCpu | default "4" | quote }}
    limits.memory: {{ .Values.resourceQuota.limitsMemory | default "4Gi" | quote }}
    pods: {{ .Values.resourceQuota.maxPods | default "30" | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sa-p5-limitrange
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "limitrange") | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.limitRange.defaultCpu | default "250m" | quote }}
        memory: {{ .Values.limitRange.defaultMemory | default "256Mi" | quote }}
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequestCpu | default "100m" | quote }}
        memory: {{ .Values.limitRange.defaultRequestMemory | default "128Mi" | quote }}
      max:
        cpu: {{ .Values.limitRange.maxCpu | default "1" | quote }}
        memory: {{ .Values.limitRange.maxMemory | default "512Mi" | quote }}
