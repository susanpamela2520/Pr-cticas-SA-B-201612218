replicaCount: 2

image:
  repository: sa-p5/notificaciones-service
  tag: dev
  pullPolicy: IfNotPresent

containerPort: 8002

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

probes:
  startup:
    failureThreshold: 20
    periodSeconds: 2
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

podDisruptionBudget:
  minAvailable: 1
