apiVersion: v1
kind: Service
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "comentarios-service") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "comentarios-service") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: comentarios-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.containerPort }}
      targetPort: {{ .Values.containerPort }}
