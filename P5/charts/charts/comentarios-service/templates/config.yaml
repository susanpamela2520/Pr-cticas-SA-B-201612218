apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "comentarios-service-config") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "comentarios-service") | nindent 4 }}
data:
  PORT: {{ .Values.containerPort | quote }}
  DB_HOST: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.global.dbName | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | default "info" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "comentarios-service-secret") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "comentarios-service") | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.global.dbUsername | quote }}
  DB_PASSWORD: {{ .Values.global.dbPassword | required "global.dbPassword es obligatorio" | quote }}
  JWT_SECRET: {{ .Values.global.jwtSecret | required "global.jwtSecret es obligatorio" | quote }}
