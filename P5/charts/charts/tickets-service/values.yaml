replicaCount: 2

image:
  repository: sa-p5/tickets-service
  tag: dev
  pullPolicy: IfNotPresent

containerPort: 8001

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 400m
    memory: 384Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# tickets-service tarda un poco mas en arrancar (SQLAlchemy crea tablas
# + conecta a RabbitMQ para el consumidor de resumenes en un hilo aparte).
probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

podDisruptionBudget:
  minAvailable: 1
