apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "tickets-service-config") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "tickets-service") | nindent 4 }}
data:
  PORT: {{ .Values.containerPort | quote }}
  COLA_TICKETS_RESUELTOS: {{ .Values.global.rabbitmqQueueTicketsResueltos | default "tickets.resueltos" | quote }}
  COLA_RESUMENES_CRON: {{ .Values.global.rabbitmqQueueResumenesCron | default "cron.resumenes" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "tickets-service-secret") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "tickets-service") | nindent 4 }}
type: Opaque
stringData:
  # DATABASE_URL y RABBITMQ_URL llevan usuario y contraseña embebidos en
  # la URL, así que se arman aquí (con printf) y viven en el Secret, no
  # en el ConfigMap, aunque el resto de sus partes no sean sensibles.
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.global.dbUsername .Values.global.dbPassword (include "sa-platform.fullname" (dict "root" $ "name" "db")) .Values.global.dbName | quote }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@%s:5672/%%2F" .Values.global.rabbitmqUsername .Values.global.rabbitmqPassword (include "sa-platform.fullname" (dict "root" $ "name" "broker")) | quote }}
  JWT_SECRET: {{ .Values.global.jwtSecret | required "global.jwtSecret es obligatorio" | quote }}
