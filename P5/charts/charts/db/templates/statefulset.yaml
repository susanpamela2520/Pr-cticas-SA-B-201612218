apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "db") | nindent 4 }}
spec:
  serviceName: {{ include "sa-platform.fullname" (dict "root" $ "name" "db-headless") }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db
    spec:
      serviceAccountName: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") }}
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
          envFrom:
            - secretRef:
                name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db-credenciales") }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.global.dbUsername }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.global.dbUsername }}"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClassName | default "standard" | quote }}
        resources:
          requests:
            storage: {{ .Values.storage.size | default "1Gi" | quote }}
