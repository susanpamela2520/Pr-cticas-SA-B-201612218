apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "db") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "db") | nindent 4 }}
rules:
  # Mínimo privilegio real: este pod no necesita hablar con la API de
  # Kubernetes para nada — el Role se deja vacío de reglas a propósito
  # (en vez de omitir el RBAC por completo), para dejar explícito que
  # el ServiceAccount existe y está enlazado, pero sin ningún permiso.
  []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "db") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db") }}
  apiGroup: rbac.authorization.k8s.io
