apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "db-credenciales") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "db") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.global.dbName | required "global.dbName es obligatorio" | quote }}
  POSTGRES_USER: {{ .Values.global.dbUsername | required "global.dbUsername es obligatorio" | quote }}
  POSTGRES_PASSWORD: {{ .Values.global.dbPassword | required "global.dbPassword es obligatorio - definelo en un values-secrets.yaml que NO se versiona" | quote }}
