replicaCount: 2

image:
  repository: sa-p5/api-gateway
  tag: dev
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

probes:
  startup:
    failureThreshold: 15
    periodSeconds: 2
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3

podDisruptionBudget:
  minAvailable: 1

ingress:
  enabled: true
  className: nginx
  host: sa-p5.local
  # Sin rewrite-target: el Gateway ya resuelve internamente el
  # enrutamiento hacia cada microservicio (/api/auth, /api/tickets...),
  # así que el Ingress solo necesita reenviar todo tal cual a su Service.
  annotations: {}
