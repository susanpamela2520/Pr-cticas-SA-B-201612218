apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.fullname" (dict "root" $ "name" "broker-credenciales") }}
  labels:
    {{- include "sa-platform.labels" (dict "root" $ "componente" "broker") | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.global.rabbitmqUsername | required "global.rabbitmqUsername es obligatorio" | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.global.rabbitmqPassword | required "global.rabbitmqPassword es obligatorio - definelo en un values-secrets.yaml que NO se versiona" | quote }}
